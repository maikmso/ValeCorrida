name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ValeCorrida.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ValeCorrida-apk
          path: ValeCorrida.apk

      # Publica a versão para o app se atualizar sozinho
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vale a Corrida v${{ github.run_number }}
          files: ValeCorrida.apk
          make_latest: true
